name: CI
on:
  push: { branches: [main, staging, 'claude/**'] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p apps/portal && npx tsc --noEmit -p apps/site
      - name: Unit tests
        run: npm test -w @oss-commerce/portal && npm test -w @oss-commerce/contracts && npm test -w @oss-commerce/emails
      - name: Build portal (demo data, preview only)
        run: npm run build -w @oss-commerce/portal
        env: { NEXT_PUBLIC_OSS_DEMO: '1' }
      - name: Build site
        run: npm run build -w @oss-commerce/site
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  # Slower, runs on its own so a flaky engine install never blocks the UI checks.
  tenancy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix services/engine
      - run: npm run proof:isolation --prefix services/engine
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w @oss-commerce/automation
        # Integration subtests (real pg-boss + Postgres) skip unless TEST_DATABASE_URL and TEST_WORKER_URL are set; run locally, see the test header.
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix services/engine
      - run: npm run typecheck --prefix services/engine && npm test --prefix services/engine
  storefront-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w @oss-commerce/storefront-sdk && npm run typecheck -w @oss-commerce/gateway && npm run typecheck -w @oss-commerce/provisioning
      - run: npm test -w @oss-commerce/storefront-sdk && npm test -w @oss-commerce/provisioning
      - name: Control-plane migrations and registry tests
        env: { PGPASSWORD: test }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c 'create database cp_test'
          for f in infra/control-plane/migrations/*.sql; do psql -h localhost -U postgres -d cp_test -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -h localhost -U postgres -d cp_test -v ON_ERROR_STOP=1 -q -f infra/control-plane/tests/storefronts.test.sql
          TEST_DATABASE_URL=postgres://postgres:test@localhost:5432/cp_test npm test -w @oss-commerce/gateway
